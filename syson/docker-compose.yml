# SysON para el proyecto Coche-sysml-
# Basado en el docker-compose oficial de eclipse-syson (v2026.9.0),
# con un volumen añadido para que la base de datos sobreviva a "docker compose down".
services:
  database:
    image: postgres:15
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: username
      POSTGRES_PASSWORD: password
    volumes:
      - syson-db:/var/lib/postgresql/data
    networks:
      - syson
  app:
    image: "${IMAGE_TAG:-eclipsesyson/syson:v2026.9.0}"
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://database/postgres
      SPRING_DATASOURCE_USERNAME: username
      SPRING_DATASOURCE_PASSWORD: password
      SIRIUS_COMPONENTS_CORS_ALLOWEDORIGINPATTERNS: "*"
      SERVER_PORT: 8080
    depends_on:
      - database
    networks:
      - syson
networks:
  syson:
volumes:
  syson-db:
